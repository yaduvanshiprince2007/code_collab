<!-- Heading -->
<div class="mb-8 text-center">
  <h2 class="text-3xl font-bold text-gray-800">Register New user</h2>

  <p class="mt-2 text-sm text-gray-500">Create new user to proceed.</p>
</div>

<!-- Form -->
<form [formGroup]="userSignupForm" (ngSubmit)="handleSubmit()" class="space-y-5">
  <!-- Name -->
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> Name </label>

    <input
      type="text"
      formControlName="name"
      placeholder="Enter your user id"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />
  </div>

  <!-- phone -->
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> Phone </label>

    <input
      type="text"
      formControlName="phoneNo"
      placeholder="Enter your password"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />
  </div>

    <!-- Email -->
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> Email </label>

    <input
      type="email"
      formControlName="email"
      placeholder="Enter your password"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />
  </div>
    <!-- Password -->
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> Password </label>
    <input
      type="password"
      formControlName="password"
      placeholder="Enter your password"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />
  </div>
      <!-- Confirm Password
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> Password </label>

    <input
      type="password"
      placeholder="Enter your password"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />
  </div> -->


  <!-- Submit Button -->
  <button
    type="submit"
    class="w-full rounded-xl bg-green-600 px-4 py-3 text-lg font-semibold text-white shadow-lg transition-all duration-300 hover:bg-green-700 hover:shadow-2xl active:scale-95"
  >
    Register
  </button>
</form>

<!-- Register -->
<div class="mt-6 text-center">
  <span class="text-sm text-gray-500"> Existing account? </span>

  <a
    routerLink="/auth/login"
    class="ml-1 text-sm font-semibold text-green-600 transition hover:text-green-700 hover:underline"
  >
    Login
  </a>
</div>
