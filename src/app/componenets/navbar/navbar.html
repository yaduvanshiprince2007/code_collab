<!-- FLOATING NAVBAR -->
<nav
  class="fixed top-5 left-1/2 z-50 w-[95%] max-w-4xl -translate-x-1/2 rounded-3xl border border-white/20 bg-white/80 px-5 py-3 shadow-[0_10px_40px_rgba(0,0,0,0.12)] backdrop-blur-xl"
>
  <div class="flex items-center justify-between">

    <!-- LOGO -->
    <div class="flex items-center gap-3">

      <div
        class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-green-500 via-emerald-500 to-teal-600 text-sm font-bold tracking-wider text-white shadow-lg"
      >
        CC
      </div>

      <div>
        <h2 class="text-base font-bold tracking-tight text-gray-900">
          Code Collab
        </h2>

        <p class="text-xs text-gray-500">
          Real-time Workspace
        </p>
      </div>

    </div>

    <!-- NAVIGATION -->
    <div class="flex items-center gap-2">

      @for (item of navBarData ; track item.route) {

        <a
          [routerLink]="item.route"
          routerLinkActive="bg-green-100 text-green-700 shadow-sm"
          class="group relative flex items-center gap-2 overflow-hidden rounded-2xl px-5 py-2.5 text-sm font-medium text-gray-600 transition-all duration-300 hover:-translate-y-0.5 hover:bg-green-50 hover:text-green-600"
        >

          <!-- HOVER EFFECT -->
          <span
            class="absolute inset-0 -z-10 opacity-0 transition-opacity duration-300 group-hover:opacity-100 bg-gradient-to-r from-green-50 to-emerald-50"
          ></span>

          <!-- NAV NAME -->
          <span>
            {{ item.name }}
          </span>

        </a>

      }

    </div>

  </div>
</nav>
