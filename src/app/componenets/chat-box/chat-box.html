<div class="relative h-screen overflow-hidden bg-gray-100">

  <!-- CHAT HEADER -->
  <div
    class="flex justify-end items-center border-b border-gray-200 bg-white px-8 py-5 shadow-sm"
  >

    <!-- USER INFO -->
    <div class="flex items-center gap-4">
      <!-- AVATAR -->
      

      <!-- DETAILS -->
      <div>

        <div class="flex items-center gap-2">

          <h2
            class="text-lg font-bold tracking-tight text-gray-900"
          >
            {{selectedUser()?.name}}
          </h2>

        </div>


      </div>
      <div
        class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-green-500 via-emerald-500 to-teal-600 text-lg font-bold text-white shadow-lg"
      >
        {{selectedUser()?.avatar}}
      </div>

    </div>

  </div>

  <!-- MESSAGE LIST -->
  <div
    class="h-[calc(100vh-170px)] overflow-y-auto bg-gradient-to-b from-gray-50 via-white to-gray-50 px-6 py-6 pb-36"
  >

    <div class="space-y-5">

      @for (message of userMessage(); track $index) {

        <!-- OWN MESSAGE -->
        @if(message.own){

        <div class="flex justify-end">

          <div
            class="max-w-[75%] rounded-[24px] rounded-br-md bg-gradient-to-r from-green-500 to-emerald-600 px-5 py-4 text-white shadow-lg"
          >

            <p class="text-sm leading-relaxed">
              {{ message.message }}
            </p>

            <div class="mt-2 flex justify-end">

              <p class="text-xs text-green-100">
                {{ message.time }}
              </p>

            </div>

          </div>

        </div>

        }

        <!-- RECEIVER MESSAGE -->
        @else {

        <div class="flex justify-start">

          <div class="flex items-end gap-3">

            <!-- AVATAR -->
            <div
              class="flex h-9 w-9 items-center justify-center rounded-xl bg-gray-200 text-xs font-semibold text-gray-700"
            >
              {{selectedUser()?.avatar}}
            </div>

            <!-- MESSAGE -->
            <div
              class="max-w-[75%] rounded-[24px] rounded-bl-md border border-gray-100 bg-white px-5 py-4 text-gray-800 shadow-sm"
            >

              <p class="text-sm leading-relaxed">
                {{ message.message }}
              </p>

              <p class="mt-2 text-right text-xs text-gray-400">
                {{ message.time }}
              </p>

            </div>

          </div>

        </div>

        }

      }

    </div>

  </div>

  <!-- FIXED MESSAGE INPUT -->
  <form
    [formGroup]="usermessage"
    (ngSubmit)="handleOnSubmit()"
    class="absolute bottom-0 left-0 right-0 border-t border-gray-200 bg-white px-6 py-5 shadow-[0_-5px_20px_rgba(0,0,0,0.05)]"
  >

    <div class="flex items-center gap-4">

      <!-- INPUT -->
      <div class="relative flex-1">

        <input
          type="text"
          formControlName="message"
          placeholder="Type your message..."
          class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-5 py-4 pr-14 text-sm outline-none transition-all duration-300 focus:border-green-400 focus:bg-white focus:shadow-lg"
        />

        <!-- EMOJI -->
        <span
          class="absolute right-4 top-1/2 -translate-y-1/2 text-xl text-gray-400"
        >
          😊
        </span>

      </div>

      <!-- SEND BUTTON -->
      <button
        type="submit"
        class="flex items-center gap-2 rounded-2xl bg-gradient-to-r from-green-500 to-emerald-600 px-7 py-4 font-semibold text-white shadow-lg transition-all duration-300 hover:scale-105 hover:shadow-2xl active:scale-95"
      >

        <span>Send</span>

        <span class="text-lg">
          ➤
        </span>

      </button>

    </div>

  </form>

</div>
