<!-- Heading -->
<div class="mb-8 text-center">
  <h2 class="text-3xl font-bold text-gray-800">Change passowrd</h2>
</div>

<!-- Form -->
<form [formGroup]="passwordChangeForm" (ngSubmit)="handleSubmit()" class="space-y-5">
  <!-- UserId -->
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> Old Password </label>

    <input
      type="password"
      formControlName="old"
      placeholder="Enter your old passowrd"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />
  </div>

  <!-- Password -->
  <div>
    <label class="mb-2 block text-sm font-semibold text-gray-700"> New Password </label>
    <<input
      type="password"
      formControlName="new"
      placeholder="Enter your new password"
      class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none transition-all duration-300 focus:border-green-500 focus:ring-2 focus:ring-green-200"
    />>
  </div>

  <!-- Submit Button -->
  <button
    type="submit"
    class="w-full rounded-xl bg-green-600 px-4 py-3 text-lg font-semibold text-white shadow-lg transition-all duration-300 hover:bg-green-700 hover:shadow-2xl active:scale-95"
  >
    Login
  </button>
</form>
