<div
  class="min-h-screen min-w-screen bg-gradient-to-br from-gray-100 via-white to-green-50 flex items-center justify-center p-4 md:p-8"
>
  <!-- MAIN PROFILE CARD -->
  <div
    class="relative w-full max-w-4xl bg-white rounded-3xl shadow-2xl shadow-emerald-200/40 overflow-hidden"
  >
    <!-- TOP SECTION (COVER) -->
    <div class="relative h-56 md:h-72 bg-gradient-to-br from-green-400 via-emerald-600 to-teal-800">
      <!-- Decorative Background Elements -->
      <img
        src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop"
        alt="Abstract Background"
        class="absolute inset-0 w-full h-full object-cover mix-blend-overlay opacity-60"
      />

      <!-- PROFILE IMAGE -->
      <div class="absolute left-1/2 top-full z-10 -translate-x-1/2 -translate-y-1/2">
        <div class="rounded-full p-1.5 bg-white shadow-xl ring-4 ring-emerald-100">
          <img
            src="https://i.pravatar.cc/400"
            alt="Profile"
            class="h-32 w-32 md:h-44 md:w-44 rounded-full object-cover"
          />
        </div>
      </div>
    </div>

    <!-- PROFILE CONTENT -->
    <div class="px-6 pb-10 pt-20 md:px-12">
      <!-- HEADER -->
      <div class="flex flex-col items-center gap-6 md:flex-row md:justify-between">
        <div class="text-center md:text-left">
          <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-gray-900">
            {{ profiledata()?.name }}
          </h1>
          <div class="mt-3 flex flex-wrap justify-center md:justify-start gap-2">
            <span
              class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-4 py-1.5 text-sm font-semibold text-emerald-700 border border-emerald-100"
            >
              <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                <path
                  fill-rule="evenodd"
                  d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
                  clip-rule="evenodd"
                ></path>
              </svg>
              Full Stack Developer
            </span>
            <span
              class="inline-flex items-center gap-1.5 rounded-full bg-gray-50 px-4 py-1.5 text-sm font-medium text-gray-600 border border-gray-100"
            >
              Open to Work
            </span>
          </div>
        </div>

        <button
          type="button"
          (click)="onEditClick()"
          class="group flex items-center gap-2 rounded-2xl bg-gradient-to-r from-green-600 to-emerald-600 px-7 py-3 text-sm font-bold text-white shadow-lg shadow-emerald-200 transition-all duration-300 hover:scale-105 hover:shadow-xl hover:shadow-emerald-300 active:scale-95"
        >
          <svg
            class="h-4 w-4 transition-transform group-hover:-rotate-12"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
            ></path>
          </svg>
          Edit Profile
        </button>
      </div>

      <!-- DETAILS GRID -->
      <div class="mt-10 grid grid-cols-1 gap-5 md:grid-cols-3">
        <!-- PHONE -->
        <div
          class="group flex items-center gap-4 rounded-2xl border border-gray-100 bg-white/70 backdrop-blur-sm p-5 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-100/50 hover:border-emerald-200"
        >
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 transition-colors group-hover:bg-emerald-600 group-hover:text-white"
          >
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
              ></path>
            </svg>
          </div>
          <div>
            <div class="text-xs font-bold uppercase tracking-widest text-gray-400">Phone</div>
            <div class="mt-1 text-base font-bold text-gray-800">
              {{ profiledata()?.phoneNo || '+1 234 567 890' }}
            </div>
          </div>
        </div>

        <!-- EMAIL -->
        <div
          class="group flex items-center gap-4 rounded-2xl border border-gray-100 bg-white/70 backdrop-blur-sm p-5 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-100/50 hover:border-emerald-200"
        >
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 transition-colors group-hover:bg-emerald-600 group-hover:text-white"
          >
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.5"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              ></path>
            </svg>
          </div>
          <div class="min-w-0">
            <div class="text-xs font-bold uppercase tracking-widest text-gray-400">Email</div>
            <div class="mt-1 truncate text-base font-bold text-gray-800">
              {{ profiledata()?.email }}
            </div>
          </div>
        </div>

        <!-- STATUS -->
        <div
          class="group flex items-center gap-4 rounded-2xl bg-gradient-to-br from-green-500 to-emerald-600 p-5 text-white shadow-lg shadow-emerald-200/50 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-300/80"
        >
          <div
            class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-white/20 backdrop-blur-sm"
          >
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
          </div>
          <div>
            <div class="text-xs font-bold uppercase tracking-widest text-emerald-100">Status</div>
            <div class="mt-1 flex items-center gap-2 text-base font-bold">
              <div
                class="h-2.5 w-2.5 rounded-full bg-emerald-200 shadow-[0_0_10px_rgba(255,255,255,0.6)] animate-pulse"
              ></div>
              Active
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
